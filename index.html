<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kleine Handen</title>
<meta name="description" content="Rustige Montessori-spelletjes voor kleine handen.">
<meta name="theme-color" content="#ECF1EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kleine Handen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="home" class="screen">
  <div class="sky" aria-hidden="true">
    <svg class="sun" viewBox="-60 -60 120 120">
      <g class="sun-rays" fill="#E8B83A">
        <rect x="-4" y="-56" width="8" height="16" rx="4"/><rect x="-4" y="40" width="8" height="16" rx="4"/>
        <rect x="-56" y="-4" width="16" height="8" rx="4"/><rect x="40" y="-4" width="16" height="8" rx="4"/>
        <rect x="-4" y="-56" width="8" height="16" rx="4" transform="rotate(45)"/><rect x="-4" y="40" width="8" height="16" rx="4" transform="rotate(45)"/>
        <rect x="-56" y="-4" width="16" height="8" rx="4" transform="rotate(45)"/><rect x="40" y="-4" width="16" height="8" rx="4" transform="rotate(45)"/>
      </g>
      <circle r="32" fill="#E8B83A"/>
      <path d="M -15 -4 q 4 5 8 0 M 7 -4 q 4 5 8 0 M -7 9 Q 0 15 7 9" fill="none" stroke="#3C4A3E" stroke-width="2.6" stroke-linecap="round"/>
      <ellipse cx="-19" cy="6" rx="5" ry="3" fill="#F0A5A0" opacity=".7"/><ellipse cx="19" cy="6" rx="5" ry="3" fill="#F0A5A0" opacity=".7"/>
    </svg>
    <div class="cloud c1"><svg viewBox="0 0 120 60"><path d="M 20 50 C 4 50, 4 30, 20 30 C 20 14, 44 8, 52 22 C 60 6, 92 10, 90 30 C 108 28, 114 50, 96 50 Z" fill="#fff"/></svg></div>
    <div class="cloud c2"><svg viewBox="0 0 120 60"><path d="M 20 50 C 4 50, 4 30, 20 30 C 20 14, 44 8, 52 22 C 60 6, 92 10, 90 30 C 108 28, 114 50, 96 50 Z" fill="#fff"/></svg></div>
    <svg class="leaves" viewBox="0 0 160 160">
      <g transform="translate(118 168) rotate(18) scale(1.15)">
        <path d="M 0 -6 C -46 -14, -54 -70, -12 -98 Q 0 -104 10 -98 C 52 -72, 46 -14, 0 -6 Z M -10 -30 Q -22 -40 -32 -40 Q -20 -30 -10 -30 Z M -10 -58 Q -20 -68 -30 -68 Q -19 -58 -10 -58 Z M 10 -34 Q 22 -44 32 -44 Q 20 -34 10 -34 Z M 10 -60 Q 20 -70 29 -70 Q 19 -60 10 -60 Z" fill="#5D845B" fill-rule="evenodd"/>
        <path d="M 0 -8 Q 3 -50 0 -96" fill="none" stroke="#A1C39F" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(40 170) rotate(-14)" stroke="#5D845B" stroke-width="2" stroke-linecap="round">
        <path d="M 0 0 L 0 -120" fill="none"/>
        <g fill="#93A95C" stroke="none">
          <ellipse cx="-9" cy="-42" rx="9" ry="4.5" transform="rotate(35 0 -42)"/>
          <ellipse cx="9" cy="-66" rx="9" ry="4.5" transform="rotate(-35 0 -66)"/>
          <ellipse cx="-9" cy="-90" rx="9" ry="4.5" transform="rotate(35 0 -90)"/>
          <ellipse cx="0" cy="-127" rx="4.5" ry="9"/>
        </g>
      </g>
    </svg>
    <div class="cloud c3"><svg viewBox="0 0 120 60"><path d="M 20 50 C 4 50, 4 30, 20 30 C 20 14, 44 8, 52 22 C 60 6, 92 10, 90 30 C 108 28, 114 50, 96 50 Z" fill="#fff"/></svg></div>
  </div>
  <button id="parent-btn" class="corner-btn" aria-label="Instellingen voor ouders (houd ingedrukt)">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a4 4 0 0 1 4 4v3h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h1V7a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v3h4V7a2 2 0 0 0-2-2z"/></svg>
    <span class="hold-ring" aria-hidden="true"></span>
  </button>
  <div id="tiles" class="tiles"></div>
  <p id="no-games" class="parent-note" hidden></p>
</main>

<section id="play" class="screen" hidden>
  <button id="home-btn" class="corner-btn" aria-label="Terug naar het begin">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 11h2v9h5v-6h4v6h5v-9h2z"/></svg>
  </button>
  <div id="stage" class="stage"></div>
</section>

<div id="settings" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-labelledby="settings-title">
    <div class="sheet-col">
      <h2 id="settings-title">Voor ouders</h2>
      <p class="muted">Deze instellingen bepalen welke spelletjes je kind ziet.</p>

      <h3>Leeftijd</h3>
      <label class="switch">
        <input type="checkbox" id="age-filter-toggle">
        <span class="track"></span>
        <span class="switch-label">Filter op leeftijd</span>
      </label>
      <div id="age-chips" class="chips"></div>
    </div>

    <div class="sheet-col">
      <h3>Geluid</h3>
      <label class="switch">
        <input type="checkbox" id="sound-toggle">
        <span class="track"></span>
        <span class="switch-label">Geluiden aan</span>
      </label>

      <h3>Tekeningen</h3>
      <label class="switch">
        <input type="checkbox" id="grain-toggle">
        <span class="track"></span>
        <span class="switch-label">Waterverf-korrel</span>
      </label>

      <button id="settings-close" class="primary">Sluiten</button>
      <p class="muted tiny">Houd het slotje twee seconden ingedrukt om hier terug te komen. Versie <span id="version"></span>.</p>
    </div>
  </div>
</div>

<!-- Shown only when the phone is held upright: a picture of a phone turning on its side. -->
<div id="rotate" aria-hidden="true">
  <svg viewBox="-80 -80 160 160">
    <path class="rot-arrow" d="M -52 -40 A 66 66 0 0 1 40 -52" fill="none" stroke="#B07E44" stroke-width="7" stroke-linecap="round"/>
    <path class="rot-arrow" d="M 30 -64 L 42 -52 L 26 -44" fill="none" stroke="#B07E44" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g class="rot-phone">
      <rect x="-26" y="-46" width="52" height="92" rx="12" fill="#3C4A3E"/>
      <rect x="-20" y="-38" width="40" height="76" rx="6" fill="#F2D9B0"/>
      <circle cx="-7" cy="-4" r="3" fill="#3C4A3E"/><circle cx="7" cy="-4" r="3" fill="#3C4A3E"/>
      <path d="M -6 6 Q 0 11 6 6" fill="none" stroke="#3C4A3E" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </svg>
</div>

<script src="js/audio.js"></script>
<script src="js/toy-utils.js"></script>
<script src="js/vendor/matter.min.js"></script>
<script src="js/games/busy.js"></script>
<script src="js/games/blobs.js"></script>
<script src="js/games/draw.js"></script>
<script src="js/games/shapes.js"></script>
<script src="js/games/blocks.js"></script>
<script src="js/games/radio.js"></script>
<script src="js/games/music.js"></script>
<script src="js/games/marbles.js"></script>
<script src="js/app.js"></script>
</body>
</html>
